<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>BodySync</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
      letter-spacing: -1px;
    }

    p {
      margin: 0;
      color: #666;
      line-height: 1.5;
    }

    .status {
      margin-top: 28px;
      padding: 14px;
      border-radius: 14px;
      background: #edf8f1;
      color: #18733c;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>BodySync</h1>

    <p>
      Dein persönlicher Tracker für Ernährung,
      Protein und Gewicht.
    </p>

    <div class="status">
      Die App funktioniert.
    </div>
  </main>
</body>
</html>
